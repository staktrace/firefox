<!doctype html>

<title>alloc-micro</title>
<style>
  html, body { margin: 0; }
  #stage {
    position: relative; width: 1000px; height: 700px; overflow: hidden;
    font: 14px sans-serif;

  .tree, .gfx, .lay { position: absolute; left: 0; top: 0; }

    will-change: transform;
  }
